<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAZWAY - Flight Bookings</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Arial,sans-serif}
.tab-active{background:#1d4ed8;color:white}
.page-btn{padding:9px 13px;border-radius:8px;background:#334155}
.page-btn.active{background:#2563eb}
</style>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<header class="bg-slate-900 border-b border-slate-700">
<div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
<div>
<h1 class="text-2xl font-bold text-blue-400">NAZWAY</h1>
<p class="text-xs text-slate-400">FLIGHT BOOKING MANAGEMENT</p>
</div>
<button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded-lg text-sm">
Logout
</button>
</div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-8">

<a href="admin-home.html" class="text-blue-400 text-sm">
← Back to Admin Home
</a>

<div class="mt-6 mb-7">
<h2 class="text-3xl font-bold">Flight Enquiries</h2>
<p class="text-sm text-slate-400 mt-2">
Manage all agent flight enquiries.
</p>
</div>

<div id="loading" class="text-center py-12 text-slate-400">
Loading Flight Bookings...
</div>

<div id="errorBox" class="hidden bg-red-900/30 border border-red-700 p-4 rounded-xl">
<p id="errorMessage"></p>
</div>

<section id="bookingContent" class="hidden">

<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
<div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
<p class="text-xs text-slate-400">Total</p>
<h3 id="totalCount" class="text-2xl font-bold mt-1">0</h3>
</div>
<div class="bg-slate-900 border border-amber-700/50 rounded-xl p-4">
<p class="text-xs text-amber-400">New</p>
<h3 id="newCount" class="text-2xl font-bold mt-1">0</h3>
</div>
<div class="bg-slate-900 border border-blue-700/50 rounded-xl p-4">
<p class="text-xs text-blue-400">Processing</p>
<h3 id="processingCount" class="text-2xl font-bold mt-1">0</h3>
</div>
<div class="bg-slate-900 border border-green-700/50 rounded-xl p-4">
<p class="text-xs text-green-400">Confirmed</p>
<h3 id="confirmedCount" class="text-2xl font-bold mt-1">0</h3>
</div>
</div>

<div class="flex flex-wrap gap-2 mb-5">
<button class="tab-active px-4 py-3 rounded-lg text-sm" data-filter="all">All</button>
<button class="bg-slate-800 px-4 py-3 rounded-lg text-sm" data-filter="new">New</button>
<button class="bg-slate-800 px-4 py-3 rounded-lg text-sm" data-filter="processing">Processing</button>
<button class="bg-slate-800 px-4 py-3 rounded-lg text-sm" data-filter="confirmed">Confirmed</button>
<button class="bg-slate-800 px-4 py-3 rounded-lg text-sm" data-filter="rejected">Rejected</button>
</div>

<div class="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-5">
<input id="searchInput" type="search"
placeholder="Search route, agent name, email or booking ID..."
class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-sm">
</div>

<div class="flex justify-between items-center mb-4">
<h3 id="listTitle" class="font-bold text-lg">All Flight Bookings</h3>
<button id="refreshBtn" class="bg-slate-700 px-4 py-2 rounded-lg text-sm">
Refresh
</button>
</div>

<div id="bookingList" class="space-y-3"></div>
<div id="pagination" class="mt-6"></div>

</section>
</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
getFirestore,doc,getDoc,getDocs,collection
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCCrmQBOFUNoUf6xv1q48MYhbOHL22JJig",
authDomain:"nazway-7d9f4.firebaseapp.com",
projectId:"nazway-7d9f4",
storageBucket:"nazway-7d9f4.firebasestorage.app",
messagingSenderId:"993042222919",
appId:"1:993042222919:web:3c0fab205ede2443f38662",
measurementId:"G-1NGSFBVMX6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loading=document.getElementById("loading");
const content=document.getElementById("bookingContent");
const bookingList=document.getElementById("bookingList");

const PAGE_SIZE=10;

let allBookings=[];
let currentFilter="all";
let currentPage=1;
let adminAccess=false;

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
})[char]);
}

function showError(message){
loading.classList.add("hidden");
content.classList.add("hidden");
document.getElementById("errorBox").classList.remove("hidden");
document.getElementById("errorMessage").textContent=message;
}

onAuthStateChanged(auth,async user=>{

if(!user){
location.replace("index.html");
return;
}

try{

const snap=await getDoc(doc(db,"agents",user.uid));

if(!snap.exists() ||
snap.data().role!=="admin" ||
snap.data().status!=="approved"){

showError("You do not have Admin permission.");
return;
}

adminAccess=true;

loading.classList.add("hidden");
content.classList.remove("hidden");

await loadBookings();

}catch(error){
console.error(error);
showError("Unable to verify Admin access.");
}

});

async function loadBookings(){

if(!adminAccess)return;

bookingList.innerHTML=
'<p class="text-center text-slate-400 py-8">Loading bookings...</p>';

try{

const snapshot=await getDocs(collection(db,"flightBookings"));

allBookings=snapshot.docs.map(item=>({
id:item.id,
...item.data()
}));

allBookings.sort((a,b)=>
String(b.createdAt||"").localeCompare(String(a.createdAt||""))
);

document.getElementById("totalCount").textContent=allBookings.length;
document.getElementById("newCount").textContent=
allBookings.filter(b=>b.status==="new").length;
document.getElementById("processingCount").textContent=
allBookings.filter(b=>b.status==="processing").length;
document.getElementById("confirmedCount").textContent=
allBookings.filter(b=>b.status==="confirmed").length;

currentPage=1;
renderBookings();

}catch(error){
console.error(error);
bookingList.innerHTML=
'<p class="text-red-400 p-5">Unable to load bookings. Check Firestore Rules.</p>';
}

}

function getFilteredBookings(){

let result=allBookings;

if(currentFilter!=="all"){
result=result.filter(b=>b.status===currentFilter);
}

const search=document.getElementById("searchInput").value.toLowerCase().trim();

if(search){
result=result.filter(b=>[
b.from,b.to,b.agentName,b.agentEmail,b.agentId,b.id
].some(value=>String(value??"").toLowerCase().includes(search)));
}

return result;

}

function renderBookings(){

const filtered=getFilteredBookings();

const titles={
all:"All Flight Bookings",
new:"New Bookings",
processing:"Processing Bookings",
confirmed:"Confirmed Bookings",
rejected:"Rejected Bookings"
};

document.getElementById("listTitle").textContent=titles[currentFilter];

if(filtered.length===0){
bookingList.innerHTML=`
<div class="bg-slate-900 border border-slate-700 rounded-xl p-8 text-center text-slate-400">
No flight bookings found.
</div>`;
document.getElementById("pagination").innerHTML="";
return;
}

const totalPages=Math.ceil(filtered.length/PAGE_SIZE);

if(currentPage>totalPages)currentPage=totalPages;

const start=(currentPage-1)*PAGE_SIZE;
const items=filtered.slice(start,start+PAGE_SIZE);

bookingList.innerHTML=items.map(booking=>{

const colors={
new:"text-amber-400",
processing:"text-blue-400",
confirmed:"text-green-400",
rejected:"text-red-400"
};

return `
<div class="bg-slate-900 border border-slate-700 rounded-xl p-4">

<div class="flex flex-wrap justify-between gap-3">

<div class="min-w-0 flex-1">
<h3 class="text-lg font-bold">
${escapeHTML(booking.from)} → ${escapeHTML(booking.to)}
</h3>

<p class="text-sm text-slate-400 mt-1">
${booking.tripType==="roundtrip"?"Round Trip":"One Way"}
</p>

<p class="text-xs text-slate-400 mt-2">
Agent: ${escapeHTML(booking.agentName)}
</p>

<p class="text-xs text-slate-400 mt-1">
Departure: ${escapeHTML(booking.departureDate)}
</p>
</div>

<div class="text-right">
<p class="${colors[booking.status]||"text-slate-400"} text-xs font-bold uppercase">
${escapeHTML(booking.status)}
</p>
<p class="text-xs text-slate-500 mt-2">
${escapeHTML(booking.createdAt)}
</p>
</div>

</div>

<a href="admin-flight-details.html?id=${encodeURIComponent(booking.id)}"
class="block text-center bg-blue-700 hover:bg-blue-600 rounded-lg px-4 py-3 mt-4 text-sm font-semibold">
View Booking Details →
</a>

</div>
`;

}).join("");

renderPagination(filtered.length);

}

function renderPagination(total){

const pages=Math.ceil(total/PAGE_SIZE);
const container=document.getElementById("pagination");

if(pages<=1){
container.innerHTML=`<p class="text-center text-xs text-slate-500">Showing ${total} bookings</p>`;
return;
}

let html=`
<div class="flex flex-wrap justify-between items-center gap-3">
<p class="text-xs text-slate-400">
Showing ${(currentPage-1)*PAGE_SIZE+1}–${Math.min(currentPage*PAGE_SIZE,total)} of ${total}
</p>
<div class="flex gap-2">
<button class="page-btn" id="previousBtn">Previous</button>
<button class="page-btn" id="nextBtn">Next</button>
</div>
</div>`;

container.innerHTML=html;

document.getElementById("previousBtn").disabled=currentPage===1;
document.getElementById("nextBtn").disabled=currentPage===pages;

document.getElementById("previousBtn").onclick=()=>{
if(currentPage>1){
currentPage--;
renderBookings();
}
};

document.getElementById("nextBtn").onclick=()=>{
if(currentPage<pages){
currentPage++;
renderBookings();
}
};

}

document.querySelectorAll("[data-filter]").forEach(button=>{

button.addEventListener("click",()=>{

currentFilter=button.dataset.filter;
currentPage=1;

document.querySelectorAll("[data-filter]").forEach(item=>{
item.className="bg-slate-800 px-4 py-3 rounded-lg text-sm";
});

button.className="tab-active px-4 py-3 rounded-lg text-sm";

renderBookings();

});

});

document.getElementById("searchInput").addEventListener("input",()=>{
currentPage=1;
renderBookings();
});

document.getElementById("refreshBtn").addEventListener("click",loadBookings);

document.getElementById("logoutBtn").addEventListener("click",async()=>{

if(!confirm("Are you sure you want to logout?"))return;

await signOut(auth);
location.replace("index.html");

});

</script>
</body>
</html>
