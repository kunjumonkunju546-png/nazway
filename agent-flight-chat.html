<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102f50">
<title>Booking Chat | NAZWAY</title>

<style>
:root{
  --navy:#102f50;
  --green:#16845b;
  --bg:#f4f6f9;
  --white:#fff;
  --text:#1d2938;
  --muted:#718096;
  --border:#e5eaf0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
.topbar{
  background:var(--navy);
  color:white;
  padding:16px;
}
.topbar-inner{
  max-width:800px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.brand{font-size:19px;font-weight:800}
.brand small{
  display:block;
  color:#d7c18d;
  font-size:10px;
  letter-spacing:2px;
  margin-top:4px;
}
.topbar button{
  background:transparent;
  border:1px solid #ffffff55;
  color:white;
  padding:9px 12px;
  border-radius:8px;
}
.wrap{
  max-width:800px;
  margin:auto;
  padding:20px 14px;
}
.back{
  display:inline-block;
  color:#174b78;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
  margin-bottom:16px;
}
.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
}
.chat-header{
  padding:18px;
  border-bottom:1px solid var(--border);
}
.chat-header h2{
  margin:0;
  color:var(--navy);
  font-size:19px;
}
.chat-header p{
  color:var(--muted);
  font-size:12px;
  margin:7px 0 0;
  overflow-wrap:anywhere;
}
.booking-info{
  background:#f7f9fb;
  padding:11px 18px;
  font-size:12px;
  color:#526174;
  border-bottom:1px solid var(--border);
}
.messages{
  height:420px;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:13px;
  background:#fff;
}
.empty{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:auto;
  line-height:1.6;
}
.message-row{
  display:flex;
}
.message-row.mine{justify-content:flex-end}
.bubble{
  max-width:85%;
  padding:11px 13px;
  border-radius:13px;
  background:#edf1f5;
  overflow-wrap:anywhere;
}
.mine .bubble{
  background:#e4f5ed;
}
.sender{
  font-size:11px;
  font-weight:bold;
  color:#174b78;
  margin-bottom:6px;
}
.mine .sender{color:var(--green)}
.message-text{
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}
.time{
  font-size:10px;
  color:var(--muted);
  margin-top:7px;
  text-align:right;
}
.chat-form{
  padding:14px;
  border-top:1px solid var(--border);
  background:#fafbfc;
}
textarea{
  width:100%;
  min-height:85px;
  resize:vertical;
  border:1px solid #dce3eb;
  border-radius:10px;
  padding:12px;
  font:inherit;
  font-size:13px;
  outline:none;
}
textarea:focus{
  border-color:#174b78;
}
.form-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}
#sendMessageBtn{
  border:0;
  background:var(--green);
  color:white;
  padding:12px 20px;
  border-radius:9px;
  font-weight:bold;
}
#sendMessageBtn:disabled{
  opacity:.55;
}
#chatStatus{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}
.error{
  background:#fff0f0;
  color:#a52d35;
  border:1px solid #f2caca;
  border-radius:10px;
  padding:13px;
  font-size:13px;
  margin-bottom:14px;
}
.hidden{display:none!important}
@media(max-width:500px){
  .messages{height:55vh;min-height:300px}
  .bubble{max-width:92%}
  .wrap{padding:15px 10px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      NAZWAY
      <small>TRAVEL PARTNER PORTAL</small>
    </div>
    <button type="button" id="logoutBtn">Logout</button>
  </div>
</header>

<main class="wrap">

<a href="agent-flights.html" class="back">← Back to Flight Bookings</a>

<div id="errorBox" class="error hidden"></div>

<section class="panel" id="chatPanel">

  <div class="chat-header">
    <h2>Chat with Admin</h2>
    <p>Discuss your flight booking directly with NAZYAN TRAVELS.</p>
  </div>

  <div class="booking-info" id="bookingInfo">
    Loading booking information...
  </div>

  <div class="messages" id="messages">
    <div class="empty">Loading messages...</div>
  </div>

  <form class="chat-form" id="chatForm">
    <textarea
      id="messageInput"
      maxlength="2000"
      required
      placeholder="Type your message here..."
    ></textarea>

    <div class="form-bottom">
      <span id="chatStatus">Messages are private to this booking.</span>
      <button type="submit" id="sendMessageBtn">Send Message</button>
    </div>
  </form>

</section>
</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCCrmQBOFUNoUf6xv1q48MYhbOHL22JJig",
  authDomain: "nazway-7d9f4.firebaseapp.com",
  projectId: "nazway-7d9f4",
  storageBucket: "nazway-7d9f4.firebasestorage.app",
  messagingSenderId: "993042222919",
  appId: "1:993042222919:web:3c0fab205ede2443f38662",
  measurementId: "G-1NGSFBVMX6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const bookingId = params.get("id");

let currentUser = null;
let stopChatListener = null;
let chatReady = false;

const $ = id => document.getElementById(id);


function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}


function showError(message){
  $("errorBox").textContent = message;
  $("errorBox").classList.remove("hidden");
  $("chatPanel").classList.add("hidden");
}


function formatTime(value){
  if(!value) return "";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())) return "";

  return date.toLocaleString("en-GB", {
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


function startChatListener(){

  if(stopChatListener){
    stopChatListener();
  }

  const messagesRef = collection(
    db,
    "flightBookings",
    bookingId,
    "messages"
  );

  stopChatListener = onSnapshot(messagesRef, snapshot => {

    const messages = snapshot.docs.map(item => ({
      id:item.id,
      ...item.data()
    }));

    messages.sort((a,b) =>
      String(a.createdAt || "").localeCompare(
        String(b.createdAt || "")
      )
    );

    const container = $("messages");

    if(messages.length === 0){
      container.innerHTML = `
        <div class="empty">
          No messages yet.<br>
          Send a message to start the conversation.
        </div>
      `;
      return;
    }

    container.innerHTML = messages.map(item => {

      const mine = item.senderId === currentUser.uid;
      const sender = item.senderRole === "admin"
        ? "NAZYAN TRAVELS - Admin"
        : "You";

      return `
        <div class="message-row ${mine ? "mine" : ""}">
          <div class="bubble">
            <div class="sender">${escapeHTML(sender)}</div>
            <div class="message-text">${escapeHTML(item.message)}</div>
            <div class="time">${escapeHTML(formatTime(item.createdAt))}</div>
          </div>
        </div>
      `;

    }).join("");

    container.scrollTop = container.scrollHeight;

  }, error => {

    console.error("Chat listener error:", error);

    $("messages").innerHTML = `
      <div class="empty">
        Unable to load messages.<br>
        Please refresh and try again.
      </div>
    `;

  });
}


$("chatForm").addEventListener("submit", async event => {

  event.preventDefault();

  if(!chatReady || !currentUser) return;

  const input = $("messageInput");
  const button = $("sendMessageBtn");
  const status = $("chatStatus");

  const message = input.value.trim();

  if(!message) return;

  button.disabled = true;
  button.textContent = "Sending...";
  status.textContent = "";

  try{

    await addDoc(
      collection(db, "flightBookings", bookingId, "messages"),
      {
        senderId: currentUser.uid,
        senderRole: "agent",
        message: message,
        createdAt: new Date().toISOString()
      }
    );

    input.value = "";
    status.textContent = "Message sent successfully.";

  }catch(error){

    console.error("Message sending failed:", error);

    status.textContent =
      "Unable to send message. Please try again.";

  }finally{

    button.disabled = false;
    button.textContent = "Send Message";

  }

});


$("logoutBtn").addEventListener("click", async () => {

  try{

    if(stopChatListener){
      stopChatListener();
    }

    await signOut(auth);
    location.replace("index.html");

  }catch(error){

    alert("Logout failed. Please try again.");

  }

});


onAuthStateChanged(auth, async user => {

  if(!user){
    location.replace("index.html");
    return;
  }

  currentUser = user;

  if(!bookingId){
    showError("Booking ID is missing.");
    return;
  }

  try{

    const agentSnap = await getDoc(
      doc(db, "agents", user.uid)
    );

    if(!agentSnap.exists()){
      showError("Agent profile not found.");
      return;
    }

    const agent = agentSnap.data();

    if(agent.role !== "agent" || agent.status !== "approved"){
      showError("Approved Agent access is required.");
      return;
    }

    const bookingSnap = await getDoc(
      doc(db, "flightBookings", bookingId)
    );

    if(!bookingSnap.exists()){
      showError("Booking not found.");
      return;
    }

    const booking = bookingSnap.data();

    if(booking.agentId !== user.uid){
      showError("You do not have permission to view this booking chat.");
      return;
    }

    $("bookingInfo").textContent =
      "Booking ID: " + bookingId +
      " | " + (booking.from || "-") +
      " → " + (booking.to || "-");

    chatReady = true;

    startChatListener();

  }catch(error){

    console.error("Chat page loading error:", error);

    showError(
      "Unable to open chat. Please check your internet connection and try again."
    );

  }

});

</script>

</body>
</html>
